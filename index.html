<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro app🍅</title>
    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="app">
    <section class="pomodoro-card">

    <header class="app-header">
      <h1>Pomodoro</h1>
      <p>Choose your focus intervals and start your session.</p>
    </header>

    <section class="setup-section">
        <p>Work intervals</p>

        <div class="interval-selector">
            <button type="button" id="decrease-intervals">−</button>

            <span id="interval-count">4</span>

            <button type="button" id="increase-intervals">+</button>
        </div>
    </section>

    <section class="timer-section">
      <p class="session-step" id="session-step">Work 1 of 4</p>
      <div class="mode-icon" id="mode-icon">🍅</div>

      <div class="timer-display" id="timer-display">
        25:00
      </div>

    </section>

    <section class="controls">
      <button type="button" id="start-button" aria-label="Start">▶</button>
      <button type="button" id="pause-button" aria-label="Pause">⏸</button>
      <button type="button" id="reset-button" aria-label="Reset">↻</button>
    </section>

  </section>
</main>
    <!-- JS -->
     <script src="./app.js"></script>
</body>
</html>
